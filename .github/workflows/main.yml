name: Android APK Olustur
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Projeyi Hazirla ve Derle
        run: |
          mkdir -p app && cd app
          python3 - << 'PY'
          import base64, io, tarfile
          data = ""
          with tarfile.open(fileobj=io.BytesIO(base64.b64decode(data)), mode="r:gz") as tf:
              tf.extractall(".")
          PY
          flutter create . --platforms=android
          python3 -c "p='android/app/src/main/AndroidManifest.xml'; s=open(p).read(); s=s.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application', 1) if 'INTERNET' not in s else s; open(p,'w').write(s)"
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: cari-takip-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
